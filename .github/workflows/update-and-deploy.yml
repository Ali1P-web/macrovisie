name: Update data and deploy MacroVisie

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "data/dashboard.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macrovisie-update-and-deploy
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Officiële data bijwerken
        run: python scripts/update_data.py

      - name: Gewijzigde data committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen"
          else
            git commit -m "Automatische data-update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Nieuwste versie ophalen
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5

      - name: Website als artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
